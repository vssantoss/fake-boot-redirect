<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Santos' Projects & Knowledge Base</title>
<meta name="description" content="A public workspace and personal knowledge base by Victor Santos, featuring software projects, technical posts, practical guides, and useful resources.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#02100a">
<meta property="og:title" content="Victor Santos' Projects & Knowledge Base">
<meta property="og:description" content="A public workspace and personal knowledge base by Victor Santos, featuring software projects, technical posts, practical guides, and useful resources.">
<meta property="og:type" content="website">
<link rel="canonical" href="">
<noscript><meta http-equiv="refresh" content="3;url=https://vss.dev"></noscript>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #02100a; overflow: hidden; }
  body { font-family: "Share Tech Mono", "Consolas", monospace; color: #39ff14; }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  #matrix { position: fixed; inset: 0; z-index: 0; opacity: .5; }

  .panel {
    position: relative; z-index: 2;
    max-width: 720px; margin: 6vh auto 0; padding: 26px 30px;
    background: rgba(2, 18, 12, .72);
    border: 1px solid #0fff8055; border-radius: 6px;
    box-shadow: 0 0 40px #0fff8022, inset 0 0 30px #0fff8011;
    backdrop-filter: blur(2px);
  }
  .bar-top { display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px dashed #0fff8044; padding-bottom:10px; margin-bottom:14px;
    text-transform:uppercase; letter-spacing:2px; font-size:13px; color:#9dffce; }
  .dot { width:9px;height:9px;border-radius:50%;background:#39ff14;display:inline-block;
    margin-left:6px; box-shadow:0 0 8px #39ff14; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50%{opacity:.3;} }

  h2 { font-size: 26px; letter-spacing: 1px; margin-bottom: 4px;
    text-shadow: 0 0 12px #39ff1488; }
  .glitch { position: relative; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; left:0; top:0; width:100%;
    overflow:hidden; opacity:.8;
  }
  .glitch::before { color:#ff003c; animation: gl1 2.6s infinite linear alternate; }
  .glitch::after  { color:#00eaff; animation: gl2 3.1s infinite linear alternate; }
  @keyframes gl1 { 0%{clip-path:inset(0 0 85% 0); transform:translate(-2px,0);}
    50%{clip-path:inset(40% 0 40% 0); transform:translate(2px,0);}
    100%{clip-path:inset(80% 0 5% 0); transform:translate(-1px,0);} }
  @keyframes gl2 { 0%{clip-path:inset(70% 0 10% 0); transform:translate(2px,0);}
    50%{clip-path:inset(20% 0 60% 0); transform:translate(-2px,0);}
    100%{clip-path:inset(10% 0 80% 0); transform:translate(1px,0);} }

  #feed { white-space: pre-wrap; margin: 16px 0; min-height: 168px; font-size: 14px; line-height:1.6; }
  .hex { color:#0aa86a; }
  .key { color:#9dffce; }
  .warn{ color:#ffd23f; }

  .progress { height: 14px; border:1px solid #0fff8066; border-radius:3px; overflow:hidden;
    background:#031c12; margin-top:10px; }
  .progress > i { display:block; height:100%; width:0%;
    background: linear-gradient(90deg,#0fff80,#39ff14); box-shadow:0 0 14px #39ff14; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:#5fbf90; margin-top:8px; }
  .cursor{ display:inline-block; width:8px;height:1em;background:#39ff14;
    vertical-align:text-bottom; animation:blink 1s steps(1) infinite; box-shadow:0 0 8px #39ff14;}
  @keyframes blink{50%{opacity:0;}}

  .skip-btn {
    position: fixed; right: 26px; bottom: 26px; z-index: 5;
    font-family: inherit; font-size: 14px; color: #39ff14; letter-spacing: 1px;
    background: rgba(2,18,12,.8); border: 1px solid #0fff8088; padding: 9px 18px; border-radius: 4px;
    cursor: pointer; box-shadow: 0 0 14px #0fff8033, inset 0 0 10px #0fff8011;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .45s ease, transform .45s ease, background .2s, box-shadow .2s;
  }
  .skip-btn.show { opacity: 1; transform: none; pointer-events: auto; }
  .skip-btn:hover { background:#0a2e1d; box-shadow:0 0 22px #39ff1466; }
  .skip-count { opacity: .7; font-size: .85em; }
  .final-msg { display: none; margin-top: 14px; color: #9dffce; font-size: 14px;
    text-shadow: 0 0 8px #39ff1455; }
  .final-msg.show { display: block; }
  .final-msg.await { animation: blink 1.2s steps(1) infinite; }
  .final-msg a { color: #39ff14; text-decoration: underline; }
</style>
</head>
<body>
  <h1 class="sr-only">Establishing secure connection and redirecting</h1>
  <p class="sr-only">If you are not redirected automatically, continue to
    <a href="https://vss.dev" id="seoLink" rel="noopener">https://vss.dev</a>.</p>
  <canvas id="matrix" aria-hidden="true"></canvas>

  <main class="panel">
    <div class="bar-top">
      <span><span class="brand-name">VSS</span>//SECURE-UPLINK</span>
      <span>STATUS: ACTIVE <i class="dot"></i></span>
    </div>
    <h2 class="glitch" data-text="DECRYPTING CHANNEL">DECRYPTING CHANNEL</h2>
    <div id="feed" aria-live="polite"></div><span class="cursor" id="cursor"></span>
    <div class="progress"><i id="bar"></i></div>
    <div class="meta"><span id="pct">0%</span><span id="rate">0.00 MB/s</span></div>
    <div class="final-msg" id="finalMsg">&gt; <span id="finalVerb">Opening</span>
      <a href="https://vss.dev" id="finalLink" rel="noopener">https://vss.dev</a><span id="finalHint"></span></div>
  </main>

  <button id="skipBtn" class="skip-btn">Skip&nbsp;&rarr;<span class="skip-count" id="skipCount"></span></button>

<script>
  /* ============================================================
     CONFIG — edit these values
     ============================================================ */
  const CONFIG = {
    duration: 5,                      // boot length in SECONDS
    redirect: "https://vss.dev",   // where to send the user
    brand: "VSS",                      // brand name shown throughout the boot
    autoRedirect: true,                // false => wait for keypress/click after boot
    skipAfter: 3                       // seconds until Skip button shows (false to hide)
  };
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get("duration")) CONFIG.duration = parseFloat(q.get("duration"));
    if (q.get("brand")) CONFIG.brand = q.get("brand");
    if (q.has("autoRedirect")) CONFIG.autoRedirect = !/^(0|false|no|off)$/i.test(q.get("autoRedirect"));
    if (q.has("skipAfter")) CONFIG.skipAfter = /^(false|no|off)$/i.test(q.get("skipAfter")) ? false : parseFloat(q.get("skipAfter"));
  })();

  /* ---- Apply brand + destination link everywhere (one place to edit) ---- */
  const BRAND = CONFIG.brand;
  document.querySelectorAll(".brand-name").forEach(el => el.textContent = BRAND);
  ["seoLink", "finalLink"].forEach(id => {
    const a = document.getElementById(id);
    if (a){ a.href = CONFIG.redirect; a.textContent = CONFIG.redirect; }
  });

  /* ---- Skip button + redirect control ---- */
  let redirected = false;
  function goRedirect(){ if (redirected) return; redirected = true; location.replace(CONFIG.redirect); }

  const skipBtn = document.getElementById("skipBtn");
  skipBtn.addEventListener("click", goRedirect);
  if (CONFIG.skipAfter !== false && !isNaN(CONFIG.skipAfter)){
    setTimeout(() => skipBtn.classList.add("show"), Math.max(0, CONFIG.skipAfter) * 1000);
  }

  // live countdown to auto-redirect (only when autoRedirect is on)
  const skipCount = document.getElementById("skipCount");
  if (CONFIG.autoRedirect){
    const bootStart = performance.now();
    const tick = setInterval(() => {
      if (redirected){ clearInterval(tick); return; }
      const remain = Math.max(0, CONFIG.duration - (performance.now() - bootStart) / 1000);
      skipCount.textContent = " (auto in " + Math.ceil(remain) + "s)";
      if (remain <= 0) clearInterval(tick);
    }, 250);
  }

  const finalMsg  = document.getElementById("finalMsg");
  const finalVerb = document.getElementById("finalVerb");
  const finalHint = document.getElementById("finalHint");
  function showFinal(verb, hint){
    finalVerb.textContent = verb;
    finalHint.textContent = hint || "";
    finalMsg.classList.add("show");
  }
  function awaitUser(){
    showFinal("Open", " — press any key or click to proceed_");
    finalMsg.classList.add("await");
    const handler = (e) => { e.preventDefault(); goRedirect(); };
    document.addEventListener("keydown", handler, { once: true });
    document.addEventListener("click", handler, { once: true });
  }

  /* ---------- Matrix rain ---------- */
  const cv = document.getElementById("matrix");
  const ctx = cv.getContext("2d");
  const fontSize = 16;
  let drops;
  const glyphs = "アイウエオカキクケコ0123456789ABCDEF<>/\\=+*#".split("");
  function resize(){
    cv.width = innerWidth; cv.height = innerHeight;
    drops = Array.from({ length: Math.floor(cv.width / fontSize) }, () => Math.random() * -50);
    // resizing the canvas resets context state, so the font is set here rather than per frame
    ctx.font = fontSize + "px monospace";
  }
  resize(); addEventListener("resize", resize);
  function rain(){
    ctx.fillStyle = "rgba(2,16,10,0.10)";
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#39ff14";
    for (let i=0;i<drops.length;i++){
      const ch = glyphs[Math.floor(Math.random()*glyphs.length)];
      ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
      if (drops[i]*fontSize > cv.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(rain);
  }
  rain();

  /* ---------- Feed + progress ---------- */
  const feed = document.getElementById("feed");
  const bar  = document.getElementById("bar");
  const pctEl= document.getElementById("pct");
  const rate = document.getElementById("rate");

  const rndHex = n => Array(n).fill(0).map(()=>Math.floor(Math.random()*16).toString(16)).join("").toUpperCase();

  const events = [
    () => `<span class="hex">> handshake 0x${rndHex(8)} … <span class="key">accepted</span></span>`,
    () => `<span class="hex">> negotiating AES-256-GCM cipher suite … OK</span>`,
    () => `<span class="hex">> exchanging keys ${rndHex(4)}-${rndHex(4)}-${rndHex(4)}</span>`,
    () => `<span class="hex">> tunneling through node ${Math.floor(Math.random()*254)}.${Math.floor(Math.random()*254)}.x.x</span>`,
    () => `<span class="warn">! intrusion countermeasures bypassed</span>`,
    () => `<span class="hex">> decrypting payload block 0x${rndHex(6)}</span>`,
    () => `<span class="hex">> verifying signature … <span class="key">valid</span></span>`,
    () => `<span class="hex">> rerouting via proxy mesh … stable</span>`,
    () => `<span class="key">> access granted. redirecting operator…</span>`
  ];

  const totalMs = Math.max(1, CONFIG.duration) * 1000;
  const start = performance.now();
  let ei = 0;
  const eventGap = totalMs / events.length;

  function frame(now){
    const p = Math.min(1, (now - start) / totalMs);
    bar.style.width = (p*100) + "%";
    pctEl.textContent = Math.round(p*100) + "%";
    rate.textContent = (Math.random()*40 + 80).toFixed(2) + " MB/s";

    if (ei < events.length && (now - start) >= ei * eventGap){
      feed.insertAdjacentHTML("beforeend", events[ei]() + "\n");
      ei++;
    }

    if (p < 1) requestAnimationFrame(frame);
    else {
      document.getElementById("cursor").style.display = "none";
      if (CONFIG.autoRedirect){
        showFinal("Opening", " …");
        setTimeout(goRedirect, 700);
      } else {
        awaitUser();
      }
    }
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
