<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Santos' Projects & Knowledge Base</title>
<meta name="description" content="A public workspace and personal knowledge base by Victor Santos, featuring software projects, technical posts, practical guides, and useful resources.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0b1020">
<meta property="og:title" content="Victor Santos' Projects & Knowledge Base">
<meta property="og:description" content="A public workspace and personal knowledge base by Victor Santos, featuring software projects, technical posts, practical guides, and useful resources.">
<meta property="og:type" content="website">
<link rel="canonical" href="">
<noscript><meta http-equiv="refresh" content="3"></noscript>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eef2ff;
    background:
      radial-gradient(1200px 800px at 70% -10%, #2a3a8f 0%, transparent 55%),
      radial-gradient(1000px 700px at 10% 110%, #6d28d9 0%, transparent 50%),
      linear-gradient(160deg, #0b1020 0%, #0a0e1a 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .stage { text-align: center; padding: 40px; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  .logo {
    width: 96px; height: 96px; margin: 0 auto 30px;
    border-radius: 24px;
    background: linear-gradient(145deg, #ffffff22, #ffffff05);
    border: 1px solid #ffffff2a;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: grid; place-items: center;
    box-shadow: 0 20px 60px -20px #000, inset 0 1px 0 #ffffff33;
    position: relative;
  }
  .logo svg { width: 50px; height: 50px; filter: drop-shadow(0 4px 12px #7c5cff66); }
  .glow { position:absolute; inset:-2px; border-radius:26px; opacity:.6;
    background: conic-gradient(from 0deg, #7c5cff, #22d3ee, #7c5cff);
    filter: blur(16px); z-index:-1; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* progress ring */
  .ring { --p: 0; width: 64px; height: 64px; margin: 0 auto 22px; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: #ffffff1f; stroke-width: 5; }
  .ring .bar   { fill: none; stroke: url(#g1); stroke-width: 5; stroke-linecap: round;
                 stroke-dasharray: 175.9; stroke-dashoffset: 175.9; transition: stroke-dashoffset .25s linear; }
  .pct { position:absolute; inset:0; display:grid; place-items:center;
         font-size:14px; font-variant-numeric: tabular-nums; color:#cdd6ff; }

  h2 { font-size: 22px; font-weight: 600; letter-spacing: .2px; }
  .status { margin-top: 10px; color: #9fb0e0; font-size: 14px; min-height: 18px;
            font-variant-numeric: tabular-nums; transition: opacity .2s; }
  .brand { position: fixed; bottom: 26px; left:0; right:0; text-align:center;
           color:#6b7aa8; font-size:12px; letter-spacing:2px; text-transform:uppercase; }

  @media (prefers-reduced-motion: reduce){ .glow,.stage{animation:none;} }

  .skip-btn {
    position: fixed; right: 28px; bottom: 28px; z-index: 5;
    font-family: inherit; font-size: 14px; font-weight: 500; color: #eef2ff;
    background: linear-gradient(145deg, #ffffff22, #ffffff08);
    border: 1px solid #ffffff33; padding: 10px 20px; border-radius: 999px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    cursor: pointer; box-shadow: 0 8px 24px -10px #000;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .45s ease, transform .45s ease, background .2s, border-color .2s;
  }
  .skip-btn.show { opacity: 1; transform: none; pointer-events: auto; }
  .skip-btn:hover { background: linear-gradient(145deg,#ffffff33,#ffffff12); border-color:#ffffff55; }
  .skip-count { opacity: .7; font-size: .85em; }
  .final-msg { margin-top: 18px; min-height: 20px; color: #cdd6ff; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .final-msg.show { opacity: 1; pointer-events: auto; }
  .final-msg.await { animation: pulseText 1.8s ease-in-out infinite; }
  .final-msg a { color: #8fd3ff; text-decoration: none; border-bottom: 1px solid #8fd3ff66; }
  @keyframes pulseText { 50% { opacity: .55; } }
</style>
</head>
<body>
  <h1 class="sr-only">Starting up and redirecting to your destination</h1>
  <p class="sr-only">If you are not redirected automatically, continue to
    <a href="https://vss.dev" id="seoLink" rel="noopener">https://vss.dev</a>.</p>

  <main class="stage">
    <div class="logo">
      <span class="glow"></span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 2 7l10 5 10-5-10-5Z" fill="#fff"/>
        <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      </svg>
    </div>

    <div class="ring" id="ring">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#7c5cff"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="32" cy="32" r="28"/>
        <circle class="bar" id="bar" cx="32" cy="32" r="28"/>
      </svg>
      <div class="pct" id="pct">0%</div>
    </div>

    <h2>Starting up</h2>
    <p class="status" id="status" aria-live="polite">Preparing your experience…</p>
    <p class="final-msg" id="finalMsg"><span id="finalVerb">Opening</span>
      <a href="https://vss.dev" id="finalLink" rel="noopener">https://vss.dev</a><span id="finalHint"></span></p>
  </main>

  <button id="skipBtn" class="skip-btn">Skip&nbsp;&rarr;<span class="skip-count" id="skipCount"></span></button>
  <div class="brand"><span class="brand-name">VSS</span>&nbsp;OS</div>

<script>
  /* ============================================================
     CONFIG — edit these two values
     ============================================================ */
  const CONFIG = {
    duration: 5,                       // boot length in SECONDS
    redirect: "https://vss.dev",   // where to send the user
    brand: "VSS",                      // brand name shown throughout the boot
    autoRedirect: true,                // false => wait for keypress/click after boot
    skipAfter: 3                       // seconds until Skip button shows (false to hide)
  };
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get("duration")) CONFIG.duration = parseFloat(q.get("duration"));
    if (q.get("redirect")) CONFIG.redirect = q.get("redirect");
    if (q.get("brand")) CONFIG.brand = q.get("brand");
    if (q.has("autoRedirect")) CONFIG.autoRedirect = !/^(0|false|no|off)$/i.test(q.get("autoRedirect"));
    if (q.has("skipAfter")) CONFIG.skipAfter = /^(false|no|off)$/i.test(q.get("skipAfter")) ? false : parseFloat(q.get("skipAfter"));
  })();

  /* ---- Apply brand + destination link everywhere (one place to edit) ---- */
  const BRAND = CONFIG.brand;
  document.querySelectorAll(".brand-name").forEach(el => el.textContent = BRAND);
  ["seoLink", "finalLink"].forEach(id => {
    const a = document.getElementById(id);
    if (a){ a.href = CONFIG.redirect; a.textContent = CONFIG.redirect; }
  });

  /* ---- Skip button + redirect control ---- */
  let redirected = false;
  function goRedirect(){ if (redirected) return; redirected = true; location.replace(CONFIG.redirect); }

  const skipBtn = document.getElementById("skipBtn");
  skipBtn.addEventListener("click", goRedirect);
  if (CONFIG.skipAfter !== false && !isNaN(CONFIG.skipAfter)){
    setTimeout(() => skipBtn.classList.add("show"), Math.max(0, CONFIG.skipAfter) * 1000);
  }

  // live countdown to auto-redirect (only when autoRedirect is on)
  const skipCount = document.getElementById("skipCount");
  if (CONFIG.autoRedirect){
    const bootStart = performance.now();
    const tick = setInterval(() => {
      if (redirected){ clearInterval(tick); return; }
      const remain = Math.max(0, CONFIG.duration - (performance.now() - bootStart) / 1000);
      skipCount.textContent = " (auto in " + Math.ceil(remain) + "s)";
      if (remain <= 0) clearInterval(tick);
    }, 250);
  }

  const finalMsg  = document.getElementById("finalMsg");
  const finalVerb = document.getElementById("finalVerb");
  const finalHint = document.getElementById("finalHint");
  function showFinal(verb, hint){
    finalVerb.textContent = verb;
    finalHint.textContent = hint || "";
    finalMsg.classList.add("show");
  }
  function awaitUser(){
    showFinal("Open", " — press any key or click to continue");
    finalMsg.classList.add("await");
    const handler = (e) => { if (e) e.preventDefault(); goRedirect(); };
    document.addEventListener("keydown", handler, { once: true });
    document.addEventListener("click", handler, { once: true });
  }

  const bar = document.getElementById("bar");
  const pct = document.getElementById("pct");
  const status = document.getElementById("status");
  const CIRC = 175.9; // 2πr, r=28

  const messages = [
    "Preparing your experience…",
    "Loading system resources…",
    "Checking for updates…",
    "Starting services…",
    "Applying personal settings…",
    "Almost there…"
  ];

  const totalMs = Math.max(1, CONFIG.duration) * 1000;
  const start = performance.now();
  let lastMsg = -1;

  function frame(now){
    const p = Math.min(1, (now - start) / totalMs);
    const pctVal = Math.round(p * 100);
    bar.style.strokeDashoffset = CIRC * (1 - p);
    pct.textContent = pctVal + "%";

    const mi = Math.min(messages.length - 1, Math.floor(p * messages.length));
    if (mi !== lastMsg){
      lastMsg = mi;
      status.style.opacity = 0;
      setTimeout(() => { status.textContent = messages[mi]; status.style.opacity = 1; }, 120);
    }

    if (p < 1) requestAnimationFrame(frame);
    else finish();
  }
  requestAnimationFrame(frame);

  function finish(){
    status.style.opacity = 0;
    setTimeout(() => { status.textContent = "Ready"; status.style.opacity = 1; }, 120);
    if (CONFIG.autoRedirect){
      showFinal("Opening", " …");
      setTimeout(goRedirect, 700);
    } else {
      awaitUser();
    }
  }
</script>
</body>
</html>
